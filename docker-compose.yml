services:
  homeassistant:
    container_name: evlink-home-ha
    image: "ghcr.io/home-assistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - ./custom_components/evlink_home:/config/custom_components/evlink_home:ro
    ports:
      - "127.0.0.1:8123:8123"
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris

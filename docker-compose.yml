services:
  homeassistant:
    container_name: evlink-home-ha
    image: "ghcr.io/home-assistant/home-assistant:2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - ./custom_components/evlink_home:/config/custom_components/evlink_home:ro
    ports:
      - "127.0.0.1:8123:8123"
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris

services:
  homeassistant:
    container_name: evlink-home-ha
    image: "ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - ./custom_components/evlink_home:/config/custom_components/evlink_home:ro
    ports:
      - "127.0.0.1:8123:8123"
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris

services:
  homeassistant:
    container_name: evlink-home-ha
    image: "ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - ./custom_components/evlink_home:/config/custom_components/evlink_home:ro
    ports:
      - "127.0.0.1:8123:8123"
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris

rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling:
    status: done
    comment: The cloud refreshes the Wallbox record about every 30 seconds.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: No requirement; the cloud client is a module of this repository.
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing beyond their coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The integration talks to the Wiser Home cloud only; there is nothing to discover on the network.
  discovery-update-info:
    status: exempt
    comment: The integration talks to the Wiser Home cloud only; there is nothing to discover on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: done
    comment: Every entity is a primary entity, so none sets a category.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: No entity is noisy or meant for debugging only.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: The only issue a user can fix, a rejected password, goes through the reauthentication flow.
  stale-devices:
    status: done
    comment: >-
      A Wallbox the account no longer lists can be deleted from its device page.
      It is not removed automatically, so a Wallbox missing from one answer of the
      cloud keeps its entities and their settings.

  # Platinum
  async-dependency:
    status: exempt
    comment: No external dependency; the internal cloud client is async.
  inject-websession:
    status: exempt
    comment: No external dependency; the internal cloud client takes the Home Assistant session.
  strict-typing:
    status: done
    comment: mypy runs in strict mode on the integration in CI.

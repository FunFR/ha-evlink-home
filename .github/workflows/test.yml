name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Home Assistant sets the floor; newer Python series lack wheels for its pins.
      - name: Use the Python series of the requires-python floor
        run: |
          floor="$(uv run --no-project --with packaging python scripts/print_requires_python_floor.py)"
          echo "FLOOR=$floor" >> "$GITHUB_ENV"
          echo "UV_PYTHON=${floor%.*}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check --output-format=github .
      - name: Check formatting with ruff
        run: uv run ruff format --check .
      - name: Check types with mypy
        run: uv run mypy custom_components/evlink_home
      - name: Run tests with coverage
        run: uv run pytest
      - name: Verify the declared floor actually resolves
        run: |
          uv python install "$FLOOR"
          uv sync --frozen --python "$FLOOR"
          uv run --python "$FLOOR" pytest

  # Not run on pull requests: a vulnerability in a version Home Assistant pins
  # can only wait for its upstream fix and must not hold dependency updates.
  audit:
    name: Audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Use the Python series of the requires-python floor
        run: |
          floor="$(uv run --no-project --with packaging python scripts/print_requires_python_floor.py)"
          echo "UV_PYTHON=${floor%.*}" >> "$GITHUB_ENV"
      - name: Scan dev dependencies for known vulnerabilities
        run: |
          uv export --only-group dev --no-hashes --no-emit-project -o requirements-audit.txt
          uv run --frozen pip-audit -r requirements-audit.txt --disable-pip --no-deps

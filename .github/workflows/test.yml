name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check --output-format=github .
      - name: Check formatting with ruff
        run: uv run ruff format --check .
      - name: Check types with mypy
        run: uv run mypy custom_components/evlink_home
      - name: Scan dev dependencies for known vulnerabilities
        run: |
          uv export --only-group dev --no-hashes --no-emit-project -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --disable-pip --no-deps
      - name: Run tests with coverage
        run: uv run pytest
      - name: Determine declared requires-python floor
        id: floor
        run: echo "version=$(uv run python scripts/print_requires_python_floor.py)" >> "$GITHUB_OUTPUT"
      - name: Verify the declared floor actually resolves
        run: |
          uv python install "${{ steps.floor.outputs.version }}"
          uv sync --frozen --python "${{ steps.floor.outputs.version }}"
          uv run --python "${{ steps.floor.outputs.version }}" pytest

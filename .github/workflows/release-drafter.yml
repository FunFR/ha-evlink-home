name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request_target: # zizmor: ignore[dangerous-triggers] labels fork PRs, never runs PR code
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  label-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      # contents: read is required: the autolabeler action fetches
      # .github/release-drafter.yml via the repos.getContent API.
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7

  update-release-draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7

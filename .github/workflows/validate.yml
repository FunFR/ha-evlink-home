name: Validate

on:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # The HACS action refuses private repositories; it starts on its own
      # once the repository is public.
      - name: Check that the repository is public
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: echo "public=$(gh api "repos/$REPOSITORY" --jq '.private | not')" >> "$GITHUB_OUTPUT"
      - name: HACS validation
        if: steps.repository.outputs.public == 'true'
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
